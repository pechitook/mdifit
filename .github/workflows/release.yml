name: Release

# Pushing a tag like v0.1.0 publishes that version to npm, with provenance.
# The tag must match package.json; `npm version <patch|minor|major>` makes both.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs a recent npm CLI.
      - run: npm install -g npm@latest
      - run: npm ci

      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm run check
      - run: npm run build

      - name: Smoke-test the packed CLI
        run: |
          npm pack
          npx --yes --package="./mdifit-$(node -p "require('./package.json').version").tgz" mdifit --version

      # Uses npm trusted publishing when it is configured for this repo on npmjs.com;
      # otherwise falls back to the NPM_TOKEN secret.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
